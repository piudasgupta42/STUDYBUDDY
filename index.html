<!DOCTYPE html>
<html>
<head>
  <title>Sakha & Sakhi – Ethical AI Study Companion</title>

  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body class="light">

<div class="container">
  <h1>Sakha & Sakhi</h1>
  <p>Your Ethical AI Study Companion</p>

  <div class="avatars">

    <div class="avatar-card" onclick="selectAvatar('sakha')">
      <lottie-player
        src="https://assets9.lottiefiles.com/packages/lf20_8wREpI.json"
        background="transparent"
        speed="1"
        loop
        autoplay>
      </lottie-player>
      <h3>Sakha</h3>
    </div>

    <div class="avatar-card" onclick="selectAvatar('sakhi')">
      <lottie-player
        src="https://assets3.lottiefiles.com/packages/lf20_khzniaya.json"
        background="transparent"
        speed="1"
        loop
        autoplay>
      </lottie-player>
      <h3>Sakhi</h3>
    </div>

  </div>

  <p class="disclaimer">
    Fictional AI characters for educational purposes only.
    Not medical, psychological, legal or financial advice.
  </p>
</div>

<script>
function selectAvatar(name){
  localStorage.setItem("avatar", name);
  window.location.href = "chat.html";
}
</script>

</body>
</html>
